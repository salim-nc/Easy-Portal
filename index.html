<!DOCTYPE html>
<html>
<head>
    <title>EasyPortal</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* STYLES EXCLUSIFS À LA PAGE D'ACCUEIL */

        body {
            background: transparent;
            margin: 0;
        }

        .center {
            background: linear-gradient(-45deg, #ffffff, #dcd0ff, #e0f2ff, #b392ff);
            background-size: 400% 400%;
            animation: gradientMovement 15s ease infinite;
            height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientMovement {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Groupe titre + logo centré ensemble */
        .center-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1cm;
        }

        .center-group h1 {
            font-size: 40px;
            color: #5f2eea;
            margin: 0;
        }

        .center-bg-logo {
            width: 420px;
            opacity: 0.18;
            pointer-events: none;
            user-select: none;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="logo-siteweb.png" alt="EasyPortal Logo" class="logo-img">
        <span>EasyPortal</span>
    </div>
    <nav>
        <button onclick="window.location.href='a-propos.html'">À propos</button>
        <button onclick="window.location.href='login.html'">Connexion</button>
    </nav>
</header>

<div class="center">
    <div class="center-group">
        <h1>Bienvenue sur EasyPortal</h1>
        <img src="portail-acceuil.png" alt="" class="center-bg-logo">
    </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
