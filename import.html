<!DOCTYPE html>
<html>
<head>
    <title>Import CSV - EasyPortal</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: linear-gradient(-45deg, #ffffff, #dcd0ff, #e0f2ff, #b392ff);
            background-size: 400% 400%;
            animation: gradientMovement 15s ease infinite;
        }

        @keyframes gradientMovement {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body onload="verifyToken();">

<header>
    <a class="logo" href="index.html" style="text-decoration: none; color: inherit; cursor: pointer;">
        <img src="logo-siteweb.png" alt="EasyPortal Logo" class="logo-img">
        <span>EasyPortal</span>
    </a>
    <nav>
        <button onclick="window.location.href='dashboard.html'">Dashboard</button>
        <button id="logoutBtn">Déconnexion</button>
    </nav>
</header>

<div style="padding: 40px; max-width: 600px; margin: 0 auto;">

    <h2 style="margin-bottom: 30px;">Import CSV</h2>

    <div id="messageContainer"></div>

    <div style="display: flex; flex-direction: column; gap: 20px;">

        <div style="background: white; border-radius: 10px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.08);">
            <h3 style="margin-bottom: 8px; color: #333;">Plaques autorisées</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Format attendu : <code>nom;prenom;plaque1;plaque2</code></p>
            <label style="display: inline-block; padding: 10px 20px; background: linear-gradient(45deg, #5f2eea, #1e90ff); color: white; border-radius: 6px; cursor: pointer; font-weight: 600;">
                Import CSV Autorisées
                <input type="file" id="importAutorisees" style="display: none;" accept=".csv">
            </label>
        </div>

        <div style="background: white; border-radius: 10px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.08);">
            <h3 style="margin-bottom: 8px; color: #333;">Plaques interdites</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Format attendu : <code>plaque;motif;date_ajout</code></p>
            <label style="display: inline-block; padding: 10px 20px; background: linear-gradient(45deg, #5f2eea, #1e90ff); color: white; border-radius: 6px; cursor: pointer; font-weight: 600;">
                Import CSV Interdites
                <input type="file" id="importInterdites" style="display: none;" accept=".csv">
            </label>
        </div>

    </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/activity.js"></script>

<script>
function showMessage(message, type) {
    const el = document.getElementById("messageContainer");
    el.innerText = message;
    el.style.background = type === "success" ? "#d1fae5" : "#fee2e2";
    el.style.color = type === "success" ? "#065f46" : "#7f1d1d";
    el.style.borderLeft = type === "success" ? "4px solid #10b981" : "4px solid #ef4444";
    el.style.padding = "15px";
    el.style.borderRadius = "8px";
    el.style.marginBottom = "20px";
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 5000);
}

document.getElementById("importAutorisees").addEventListener("change", async function(event) {
    const file = event.target.files[0];
    if (!file) return;

    try {
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch(API_BASE + "/plaques/import-csv", {
            method: "POST",
            headers: { "Authorization": "Bearer " + localStorage.getItem("token") },
            body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Erreur lors de l'import");

        showMessage("✓ Plaques autorisées importées avec succès !", "success");
        event.target.value = "";

    } catch (err) {
        showMessage("Erreur import autorisées : " + err.message, "error");
    }
});

document.getElementById("importInterdites").addEventListener("change", async function(event) {
    const file = event.target.files[0];
    if (!file) return;

    try {
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch(API_BASE + "/plaques/import-csv-blacklist", {
            method: "POST",
            headers: { "Authorization": "Bearer " + localStorage.getItem("token") },
            body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Erreur lors de l'import");

        showMessage("✓ Plaques interdites importées avec succès !", "success");
        event.target.value = "";

    } catch (err) {
        showMessage("Erreur import interdites : " + err.message, "error");
    }
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
        logoutBtn.addEventListener("click", function(e) {
            e.preventDefault();
            localStorage.removeItem("token");
            window.location.replace("index.html");
        });
    }
});
</script>

</body>
</html>
