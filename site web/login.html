<!DOCTYPE html>
<html>
<head>
    <title>Connexion - EasyPortal</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* --- Styles du fond dynamique --- */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: linear-gradient(-45deg, #ffffff, #dcd0ff, #e0f2ff, #b392ff);
            background-size: 400% 400%;
            animation: gradientMovement 15s ease infinite;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradientMovement {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background: transparent !important;
            box-shadow: none !important;
        }

        .center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* -------------------------------- */

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            width: 100%;
            padding-right: 70px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: #5f2eea;
            padding: 5px 10px;
            font-weight: 600;
        }

        .toggle-password:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <a class="logo" href="index.html" style="text-decoration: none; color: inherit; cursor: pointer;">
        <img src="logo-siteweb.png" alt="EasyPortal Logo" class="logo-img">
        <span>EasyPortal</span>
    </a>
    <nav>
        <button onclick="window.location.href='index.html'">Accueil</button>
    </nav>
</header>

<div class="center">
    <div class="card login-card">
        <h2>Connexion Administrateur</h2>

        <form id="loginForm" novalidate>
            <div class="input-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Entrez votre email" 
                    required
                    autocomplete="email"
                    maxlength="255">
            </div>

            <div class="input-group">
                <label for="password">Mot de passe</label>
                <div class="password-container">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Entrez votre mot de passe" 
                        required
                        autocomplete="current-password"
                        maxlength="255">
                    <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Afficher/Masquer le mot de passe">Afficher</button>
                </div>
            </div>

            <button type="submit" class="login-btn">Se connecter</button>
            <p id="error" class="error-msg" style="color: red; display: none;" role="alert"></p>
        </form>
    </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/activity.js"></script>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleBtn = document.querySelector(".toggle-password");
        
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleBtn.textContent = "Masquer";
        } else {
            passwordInput.type = "password";
            toggleBtn.textContent = "Afficher";
        }
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorEl = document.getElementById("error");

        errorEl.style.display = "none";
        errorEl.textContent = "";

        if (!email || !password) {
            errorEl.textContent = "Email ou mot de passe incorrect.";
            errorEl.style.display = "block";
            return;
        }

        try {
            const data = await apiRequest("/auth/login/admin", "POST", { 
                email: email,
                password: password
            });

            const token = data.token || (data.data && data.data.token) || data.accessToken;

            if (token) {
                localStorage.setItem("token", token);
                if (typeof trackActivity === "function") trackActivity("login");
                window.location.replace("dashboard.html");
            } else {
                errorEl.textContent = "Identifiants incorrects.";
                errorEl.style.display = "block";
            }
        } catch (err) {
            errorEl.textContent = "Erreur de connexion. Réessayez.";
            errorEl.style.display = "block";
        }
    });
</script>

</body>
</html>
