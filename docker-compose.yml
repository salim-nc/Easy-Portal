services:
  api:
    build: ./api
    container_name: easyportal-api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    restart: unless-stopped
    networks:
      - easyportal-network
  camera:
    build: ./camera
    container_name: easyportal-camera
    ports:
      - "8000:8000"
    devices:
      - /dev/video0:/dev/video0
      - /dev/vchiq:/dev/vchiq
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
      - /dev/media2:/dev/media2
      - /dev/media3:/dev/media3
    volumes:
      - /run/udev:/run/udev:ro
      - /usr/lib/python3/dist-packages:/usr/lib/python3/dist-packages:ro
      - /usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu:ro
      - /usr/share/libcamera:/usr/share/libcamera:ro
      - /usr/bin/python3:/usr/bin/python3:ro
      - /usr/lib/python3.13:/usr/lib/python3.13:ro
      - /etc/alternatives:/etc/alternatives:ro
    environment:
      - PYTHONPATH=/usr/lib/python3/dist-packages
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu
    privileged: true
    restart: unless-stopped
    networks:
      - easyportal-network
  portail:
    build: ./portail
    container_name: easyportal-portail
    ports:
      - "5000:5000"
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /usr/lib/python3/dist-packages:/usr/lib/python3/dist-packages:ro
      - /usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu:ro
      - /usr/lib/libarmadillo.so.14:/usr/lib/libarmadillo.so.14:ro
      - /usr/lib/libarmadillo.so.14.2.3:/usr/lib/libarmadillo.so.14.2.3:ro
      - /usr/bin/python3:/usr/bin/python3:ro
      - /usr/lib/python3.13:/usr/lib/python3.13:ro
      - /etc/alternatives:/etc/alternatives:ro
      - /etc/ssl:/etc/ssl:ro
      - /home/ciel-easyportal/.local/lib/python3.13:/home/ciel-easyportal/.local/lib/python3.13:ro
    environment:
      - PYTHONPATH=/usr/lib/python3/dist-packages:/home/ciel-easyportal/.local/lib/python3.13/site-packages
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:/usr/lib
    privileged: true
    restart: unless-stopped
    networks:
      - easyportal-network
networks:
  easyportal-network:
    driver: bridge
