services:
  api:
    build: ./api
    container_name: easyportal-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - easyportal-network
  camera:
    build: ./camera
    container_name: easyportal-camera
    ports:
      - "8000:8000"
    devices:
      - /dev/video0:/dev/video0
      - /dev/vchiq:/dev/vchiq
    volumes:
      - /run/udev:/run/udev:ro
      - /usr/lib/python3/dist-packages:/usr/lib/python3/dist-packages:ro
      - /usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu:ro
      - /usr/share/libcamera:/usr/share/libcamera:ro
      - /usr/bin/python3:/usr/bin/python3:ro
      - /usr/lib/python3.13:/usr/lib/python3.13:ro
      - /etc/alternatives:/etc/alternatives:ro
    environment:
      - PYTHONPATH=/usr/lib/python3/dist-packages
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu
    privileged: true
    restart: unless-stopped
    networks:
      - easyportal-network
networks:
  easyportal-network:
    driver: bridge
