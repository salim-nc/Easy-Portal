<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - EasyPortal</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: linear-gradient(-45deg, #ffffff, #dcd0ff, #e0f2ff, #b392ff);
            background-size: 400% 400%;
            animation: gradientMovement 15s ease infinite;
        }

        @keyframes gradientMovement {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body onload="verifyToken()">

<header>
    <a class="logo" href="index.html" style="text-decoration: none; color: inherit; cursor: pointer;">
        <img src="logo-siteweb.png" alt="EasyPortal Logo" class="logo-img">
        <span>EasyPortal</span>
    </a>
    <nav>
        <button onclick="window.location.href='logs.html'">Logs</button>
        <button onclick="window.location.href='admin-users.html'">Création Utilisateurs</button>
        <button onclick="window.location.href='import.html'">Import CSV</button>
        <button onclick="window.location.href='export.html'">Export CSV</button>
        <button id="logoutBtn">Déconnexion</button>
    </nav>
</header>

<div class="dashboard-container">
    <button class="open-btn" onclick="openPortal()">Ouvrir le portail</button>
    
    <div class="video-card">
        <div class="video-wrapper">
            <iframe src="http://172.16.15.29:8000/stream.html"></iframe>
        </div>
    </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/activity.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
        logoutBtn.addEventListener("click", function(e) {
            e.preventDefault();
            localStorage.removeItem("token");
            window.location.replace("index.html");
        });
    }
});
</script>

</body>
</html>
