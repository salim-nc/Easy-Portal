<!DOCTYPE html>
<html>
<head>
    <title>Connexion - EasyPortal</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            width: 100%;
            padding-right: 70px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: #5f2eea;
            padding: 5px 10px;
            font-weight: 600;
        }

        .toggle-password:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="logo-siteweb.png" alt="EasyPortal Logo" class="logo-img">
        <span>EasyPortal</span>
    </div>
    <nav>
        <button onclick="window.location.href='index.html'">Accueil</button>
    </nav>
</header>

<div class="center">
    <div class="card login-card">
        <h2>Connexion Administrateur</h2>

        <form id="loginForm" novalidate>
            <div class="input-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Entrez votre email" 
                    required
                    autocomplete="email"
                    maxlength="255">
            </div>

            <div class="input-group">
                <label for="password">Mot de passe</label>
                <div class="password-container">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Entrez votre mot de passe" 
                        required
                        autocomplete="current-password"
                        maxlength="255">
                    <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Afficher/Masquer le mot de passe">Afficher</button>
                </div>
            </div>

            <button type="submit" class="login-btn">Se connecter</button>
            <p id="error" class="error-msg" style="color: red; display: none;" role="alert"></p>
        </form>
    </div>
</div>

<!-- LES SCRIPTS DANS LE BON ORDRE -->
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/activity.js"></script>

<script>
    // ==============================
    // SÉCURITÉ - Fonction pour masquer/afficher le mot de passe
    // ==============================
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleBtn = document.querySelector(".toggle-password");
        
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleBtn.textContent = "Masquer";
        } else {
            passwordInput.type = "password";
            toggleBtn.textContent = "Afficher";
        }
    }

    // ==============================
    // SÉCURITÉ - Fonction pour nettoyer les entrées (prévention XSS)
    // ==============================
    function sanitizeInput(input) {
        const div = document.createElement('div');
        div.textContent = input;
        return div.innerHTML;
    }

    // ==============================
    // SÉCURITÉ - Fonction pour valider l'email
    // ==============================
    function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
    }

    // ==============================
    // GESTION DE LA CONNEXION
    // ==============================
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorEl = document.getElementById("error");

        errorEl.style.display = "none";
        errorEl.textContent = "";

        // ==============================
        // VALIDATION CÔTÉ CLIENT
        // ==============================
        if (!email || !password) {
            errorEl.textContent = "Email ou mot de passe incorrect.";
            errorEl.style.display = "block";
            return;
        }

        // Validation du format email
        if (!isValidEmail(email)) {
            errorEl.textContent = "Email ou mot de passe incorrect.";
            errorEl.style.display = "block";
            return;
        }

        // Validation de la longueur du mot de passe
        if (password.length < 6) {
            errorEl.textContent = "Email ou mot de passe incorrect.";
            errorEl.style.display = "block";
            return;
        }

        try {
            // ==============================
            // ENVOI SÉCURISÉ À L'API
            // ==============================
            const data = await apiRequest("/auth/login/admin", "POST", { 
                email: email,
                password: password
            });

            // Récupérer le token
            const token = data.token || (data.data && data.data.token) || data.accessToken;

            if (token) {
                // ==============================
                // SÉCURITÉ - Stockage sécurisé du token
                // ==============================
                localStorage.setItem("token", token);

                // Tracer l'activité
                if (typeof trackActivity === "function") {
                    trackActivity("login");
                }

                // Redirection sécurisée
                window.location.replace("dashboard.html");
            } else {
                // Message d'erreur générique (ne pas révéler si email ou mot de passe est incorrect)
                errorEl.textContent = "Identifiants incorrects.";
                errorEl.style.display = "block";
                document.getElementById("closeError").style.display = "block"; // Bouton fermer visible
            }
        } catch (err) {
            console.error("Erreur login:", err);
            
            // Message d'erreur générique pour ne pas donner d'info aux pirates
            if (err.message.includes("Impossible de joindre")) {
                errorEl.textContent = "Erreur de connexion au serveur.";
            } else {
                errorEl.textContent = "Erreur de connexion. Réessayez.";
            }
            errorEl.style.display = "block";
            document.getElementById("closeError").style.display = "block"; // Bouton fermer visible
        }
    });

    // ==============================
    // SÉCURITÉ - Vider les champs sensibles en quittant la page
    // ==============================
    window.addEventListener("beforeunload", function() {
        document.getElementById("password").value = "";
    });
</script>

</body>
</html>
